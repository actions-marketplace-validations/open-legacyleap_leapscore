name: "LeapScore local scan"
description: "Checkout-first LeapScore scan: grades the checked-out working tree locally, with no clone and no token."
branding:
  icon: "activity"
  color: "blue"

inputs:
  path:
    description: "Local directory to scan (default: the checked-out working tree)"
    required: false
    default: "."
  fail_under:
    description: "Exit non-zero via core.setFailed when the sealed score is below this 0-100 threshold"
    required: false
    default: ""
  fail_under_band:
    description: "Band-native gate: fail when the sealed score is below this band's floor (critical|high|moderate|low). Mutually exclusive with fail_under."
    required: false
    default: ""
  strict:
    description: "'true' = zero-socket mode (vendored snapshots only; any network attempt aborts)"
    required: false
    default: "false"
  out_dir:
    description: "Report directory receiving report.json + report.html + report.md"
    required: false
    default: "leapscore-report"
  engine_ref:
    description: "Pinned engine ref for meta.engineSha7 identity"
    required: false
    default: ""
  baseline:
    description: "Path to a previously sealed report.json to compare against; writes report.delta.json beside the sealed reports"
    required: false
    default: ""
  ratchet:
    description: "Ratchet gate on the code-attributable part of the delta: 'true' for tolerance 0, or a tolerance in points (e.g. '2.5'). Empty or 'false' disables the gate. Requires baseline."
    required: false
    default: ""
  badge:
    description: "Path to write the score badge SVG (e.g. 'leapscore-report/badge.svg'); an empty value writes no badge. The embed snippet is written beside it as '<name>.snippet.md'."
    required: false
    default: ""

outputs:
  exit-code:
    description: "Scanner exit code: 0 pass, 1 crash, 2 usage-or-refused, 3 threshold or ratchet trip"
  score:
    description: "Sealed score (when a report was written)"
  tier:
    description: "Sealed band: Low, Moderate, High, or Critical"
  badge-path:
    description: "Path of the written badge SVG (when the badge input was set)"

runs:
  using: "node24"
  main: "action/dist/index.js"
