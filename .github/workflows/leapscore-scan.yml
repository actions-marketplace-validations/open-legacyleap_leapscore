# LeapScore workflow scan v1 — execution-only (self or public target).
# No checkout: the engine clones the target internally from URL.
# No surfacing: no check runs, issues, or comments (see docs/plans/12_GITHUB_SURFACE_PLAN.md).
# Bump LEAPSCORE_ENGINE_REF to the newest engine commit when the scan logic changes.
name: LeapScore scan

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'owner/repo to scan (default: self)'
        required: false
        default: ''
      sha:
        description: 'reserved — non-empty is rejected in v1'
        required: false
        default: ''

env:
  # Pinned engine ref — also passed as --engine-ref so meta.engineSha7 is truthful.
  # Must be a commit that contains packages/engine/bin/scan.ts.
  LEAPSCORE_ENGINE_REF: cf794d4775a6f8a3e9b021ed51096149201a7cb9

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Allow fetching the engine repo (it may be private)
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan with LeapScore
        # tsx rides along on PATH so the bin's `#!/usr/bin/env tsx` shebang resolves;
        # npm does not reliably install workspaceBins' runtime deps from a git spec.
        run: npx -p tsx@4 -p "github:${{ github.repository }}#${LEAPSCORE_ENGINE_REF}" leapscore-scan --repo "${{ inputs.target_repo || github.repository }}" --sha "${{ inputs.sha }}" --out leapscore-report.json --engine-ref "${LEAPSCORE_ENGINE_REF}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: leapscore-${{ github.run_number }}
          path: leapscore-report.json
          retention-days: 30
