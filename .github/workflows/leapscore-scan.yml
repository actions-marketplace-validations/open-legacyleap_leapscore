# LeapScore workflow scan v2 (local-first dogfood) + project surface v1.
# Checkout-first: the Action scans the checked-out working tree with
# `leapscore-scan scan <path>` — no internal clone, no PAT for self scans.
# Surfacing: sealed report syncs labeled issues into the runner repo (no check
# runs, boards, or comments — see docs/plans/15_PROJECT_SURFACE_V1.md).
name: LeapScore scan

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_under:
        description: '0-100 threshold: fail the step when the sealed score is below it (empty = no gate)'
        required: false
        default: ''
      strict:
        description: "'true' = zero-socket scan (vendored snapshots only)"
        required: false
        default: 'false'
      surface:
        description: "'true' = scan then sync issues; 'false' = execution-only"
        required: false
        default: 'true'

env:
  # Pinned engine ref — also passed as engine_ref so meta.engineSha7 is truthful.
  LEAPSCORE_ENGINE_REF: 3886fde0c15bd5edf1f018af8eb1b8f6a0e79e66

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Scan working tree with LeapScore
        id: scan
        uses: ./action
        with:
          path: .
          fail_under: ${{ inputs.fail_under }}
          strict: ${{ inputs.strict }}
          out_dir: leapscore-report
          engine_ref: ${{ env.LEAPSCORE_ENGINE_REF }}
      - name: Surface issues
        # Warn-only: issue/label failures never rewrite the sealed scan verdict.
        # Runs only for sealed scans (success) with surface enabled (default true).
        if: success() && inputs.surface == 'true'
        run: npx -p tsx@4 -p "github:${{ github.repository }}#${LEAPSCORE_ENGINE_REF}" surface --from leapscore-report/report.json --repo "${{ github.repository }}" --repo-a "${{ github.repository }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SURFACE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: leapscore-${{ github.run_number }}
          path: leapscore-report/
          retention-days: 30
