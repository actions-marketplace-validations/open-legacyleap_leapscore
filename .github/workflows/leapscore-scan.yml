# LeapScore workflow scan v1 + project surface v1 (issues-only tracker).
# No checkout: the engine clones the target internally from URL.
# Surfacing: sealed report syncs labeled issues into the runner repo (no check
# runs, boards, or comments — see docs/plans/15_PROJECT_SURFACE_V1.md).
# Bump LEAPSCORE_ENGINE_REF to the newest engine commit when the scan logic changes.
name: LeapScore scan

permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'owner/repo to scan (default: self)'
        required: false
        default: ''
      sha:
        description: 'reserved — non-empty is rejected in v1'
        required: false
        default: ''
      surface:
        description: "'true' = scan then sync issues; 'false' = execution-only"
        required: false
        default: 'true'

env:
  # Pinned engine ref — also passed as --engine-ref so meta.engineSha7 is truthful.
  # Must be a commit that contains packages/engine/bin/scan.ts.
  LEAPSCORE_ENGINE_REF: 3886fde0c15bd5edf1f018af8eb1b8f6a0e79e66

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Allow fetching the engine repo (it may be private)
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan with LeapScore
        # tsx rides along on PATH so the bin's `#!/usr/bin/env tsx` shebang resolves;
        # npm does not reliably install workspaceBins' runtime deps from a git spec.
        run: npx -p tsx@4 -p "github:${{ github.repository }}#${LEAPSCORE_ENGINE_REF}" leapscore-scan --repo "${{ inputs.target_repo || github.repository }}" --sha "${{ inputs.sha }}" --out leapscore-report.json --engine-ref "${LEAPSCORE_ENGINE_REF}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Surface issues
        # Warn-only: issue/label failures never rewrite the sealed scan verdict.
        # Runs only for sealed scans (success) with surface enabled (default true).
        if: success() && inputs.surface == 'true'
        run: npx -p tsx@4 -p "github:${{ github.repository }}#${LEAPSCORE_ENGINE_REF}" leapscore-scan --surface-from leapscore-report.json --repo "${{ inputs.target_repo || github.repository }}" --repo-a "${{ github.repository }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --engine-ref "${LEAPSCORE_ENGINE_REF}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: leapscore-${{ github.run_number }}
          path: leapscore-report.json
          retention-days: 30
